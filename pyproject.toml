[project]
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.10.1",
    "opencv-python>=4.12.0.88",
    "platformdirs>=4.5.1",
    "pywin32>=311",
    "pynput>=1.8.1",
    "pytesseract>=0.3.13",
    "requests>=2.32.5",
    "imutils>=0.5.4",
    "onnx>=1.20.0",
    "onnxruntime>=1.23.2",
    "thefuzz>=0.22.1",
    "windows-capture>=1.5.0",
    "qtwaitingspinner @ git+https://github.com/z3ntu/QtWaitingSpinner.git",
]
name = "DeepwokenHelper"
version = "1.3.2"
description = "Deepwoken Helper to help you choose your cards."
readme = "README.md"

[[project.authors]]
name = "Tuxsuper"

[project.license]
text = "GPL-3.0-only"

[dependency-groups]
dev = ["toml>=0.10.2", "pyinstaller>=6.17.0", "pytest>=9.0.1"]

[tool.ruff.lint]
ignore = ["F405", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["deepwokenhelper"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
    "testing",
]
